project:
  title: Eyerest Reminder
  url:   https://github.com/soko-solongo/functions
  description: |
    Eyerest Reminder is a Chrome browser extension that helps screen-heavy users protect their eyes by reminding them a regular break of 1 minute once in every 30 or 60 min based on user's choice.
    
    The problem: Most people know they should rest their eyes, but forget to do it. This extension makes it harder to ignore, because a big sheep grows and takes over every open tab making the user impossible to work unless they click "Cancel" which terminates every active flow.
